<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Verify OTP - PhysioAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body class="bg-gradient-to-br from-purple-600 to-blue-600 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <i class="fas fa-key text-5xl text-purple-600"></i>
            <h1 class="text-2xl font-bold mt-2 text-gray-800">Verify OTP</h1>
            <p class="text-gray-500 text-sm">Enter the 6-digit code sent to your email</p>
            <p class="text-xs text-gray-400 mt-1">{{ email }}</p>
        </div>
        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">OTP Code</label>
                <input type="text" name="otp" placeholder="000000" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-center text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-purple-500" maxlength="6" required>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-2 rounded-lg font-semibold hover:scale-105 transition">Verify OTP</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4"><a href="/forgot_password" class="text-purple-600 hover:underline">← Request new OTP</a></p>
    </div>
</body>
</html>
