<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Doctor Registration - PhysioAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="bg-gradient-to-br from-purple-600 to-blue-600 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96"><div class="text-center mb-6"><i class="fas fa-user-md text-5xl text-purple-600"></i><h1 class="text-2xl font-bold mt-2 text-gray-800">Doctor Registration</h1><p class="text-gray-500">Join as a Physiotherapy Professional</p></div>{% if error %}<div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">{{ error }}</div>{% endif %}<form method="POST"><input type="text" name="full_name" placeholder="Full Name" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-purple-500" required><input type="email" name="email" placeholder="Email Address" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-purple-500" required><input type="tel" name="phone" placeholder="Phone Number" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-purple-500" required><input type="password" name="password" placeholder="Password" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-purple-500" required><input type="password" name="confirm_password" placeholder="Confirm Password" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-purple-500" required><button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-2 rounded-lg font-semibold hover:scale-105 transition">Register</button></form><p class="text-center text-sm text-gray-500 mt-4">Already registered? <a href="/login" class="text-purple-600 hover:underline">Login</a></p></div>
</body>
</html>
