<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - PhysioAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        /* tiny extra for smoother icon interaction, no design changes */
        .password-toggle-icon {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .password-toggle-icon:hover {
            color: #7c3aed; /* purple-600 */
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-600 to-blue-600 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">
        <div class="text-center mb-6">
            <i class="fas fa-user-md text-5xl text-purple-600"></i>
            <h1 class="text-2xl font-bold mt-2 text-gray-800">Doctor Registration</h1>
            <p class="text-gray-500">Join as a Physiotherapy Professional</p>
        </div>

        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <!-- Full Name -->
            <input type="text" name="full_name" placeholder="Full Name" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-purple-500" required>

            <!-- Email Address -->
            <input type="email" name="email" placeholder="Email Address" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-purple-500" required>

            <!-- Phone Number -->
            <input type="tel" name="phone" placeholder="Phone Number" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-purple-500" required>

            <!-- Password field with eye toggle (mb-3 spacing preserved) -->
            <div class="relative mb-3">
                <input type="password" name="password" id="passwordInput" placeholder="Password" 
                       class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500" 
                       required>
                <span class="absolute inset-y-0 right-0 flex items-center pr-3 password-toggle-icon" id="togglePassword">
                    <i class="fas fa-eye text-gray-500" id="passwordEyeIcon"></i>
                </span>
            </div>

            <!-- Confirm Password field with eye toggle (mb-4 spacing preserved) -->
            <div class="relative mb-4">
                <input type="password" name="confirm_password" id="confirmPasswordInput" placeholder="Confirm Password" 
                       class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500" 
                       required>
                <span class="absolute inset-y-0 right-0 flex items-center pr-3 password-toggle-icon" id="toggleConfirmPassword">
                    <i class="fas fa-eye text-gray-500" id="confirmEyeIcon"></i>
                </span>
            </div>

            <!-- Register Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-2 rounded-lg font-semibold hover:scale-105 transition">
                Register
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Already registered? <a href="/login" class="text-purple-600 hover:underline">Login</a>
        </p>
    </div>

    <script>
        (function() {
            // Get DOM elements
            const passwordInput = document.getElementById('passwordInput');
            const confirmPasswordInput = document.getElementById('confirmPasswordInput');
            const togglePassword = document.getElementById('togglePassword');
            const toggleConfirm = document.getElementById('toggleConfirmPassword');
            const passwordEyeIcon = document.getElementById('passwordEyeIcon');
            const confirmEyeIcon = document.getElementById('confirmEyeIcon');

            // Helper: toggle password visibility for given input & eye icon element
            function toggleVisibility(inputField, eyeIconElement) {
                if (!inputField || !eyeIconElement) return;
                // Check current type
                if (inputField.type === 'password') {
                    inputField.type = 'text';
                    // change icon to 'eye-slash' indicating password is visible
                    eyeIconElement.classList.remove('fa-eye');
                    eyeIconElement.classList.add('fa-eye-slash');
                } else {
                    inputField.type = 'password';
                    // change icon back to 'eye' indicating hidden
                    eyeIconElement.classList.remove('fa-eye-slash');
                    eyeIconElement.classList.add('fa-eye');
                }
            }

            // Event listeners for password toggles
            if (togglePassword && passwordInput && passwordEyeIcon) {
                togglePassword.addEventListener('click', function(e) {
                    e.preventDefault();   // avoid any unintended ripple
                    toggleVisibility(passwordInput, passwordEyeIcon);
                });
            }

            if (toggleConfirm && confirmPasswordInput && confirmEyeIcon) {
                toggleConfirm.addEventListener('click', function(e) {
                    e.preventDefault();
                    toggleVisibility(confirmPasswordInput, confirmEyeIcon);
                });
            }

            // Optional: ensure that pressing "Enter" in any field doesn't conflict
            // and that both fields maintain the same required behavior. No extra logic needed.
        })();
    </script>
</body>
</html>
