<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Consultation - Dr. Shubham Singh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8">
    <div class="container mx-auto max-w-2xl px-4">
        <div class="bg-white rounded-2xl shadow-xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-indigo-700">Question {{ q_num }} of {{ total }}</h2>
                <i class="fas fa-robot text-3xl text-indigo-400"></i>
            </div>
            {% if remaining <= 2 %}
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-3 mb-4 text-sm text-yellow-700">
                <i class="fas fa-info-circle mr-1"></i> We may ask up to 10 questions if needed.
            </div>
            {% endif %}
            <div class="bg-gray-50 rounded-xl p-5 mb-6">
                <p class="text-gray-800 text-lg">{{ question }}</p>
            </div>
            <form method="POST">
                <label class="block text-sm font-medium mb-2">Your Answer:</label>
                <textarea name="answer" rows="3" class="w-full border rounded-lg px-3 py-2 mb-4" required></textarea>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg"><i class="fas fa-arrow-right mr-2"></i> Next</button>
            </form>
        </div>
    </div>
</body>
</html>
