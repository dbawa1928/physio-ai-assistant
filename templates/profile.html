<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>My Profile - PhysioAI</title>
    <script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-2xl"><div class="bg-white rounded-2xl shadow-xl overflow-hidden"><div class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-4 py-3 flex flex-wrap justify-between items-center gap-2"><h1 class="text-xl font-bold"><i class="fas fa-user-circle mr-2"></i>My Profile</h1><div class="flex gap-2"><a href="/" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded text-sm"><i class="fas fa-home"></i> Home</a><a href="/logout" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm"><i class="fas fa-sign-out-alt"></i> Logout</a></div></div><div class="p-6"><form method="POST"><div class="mb-4"><label class="block text-gray-700 font-semibold mb-1">Full Name</label><input type="text" name="full_name" value="{{ user[0] }}" class="w-full px-3 py-2 border rounded-lg" required></div><div class="mb-4"><label class="block text-gray-700 font-semibold mb-1">Email</label><input type="email" value="{{ user[1] }}" class="w-full px-3 py-2 border rounded-lg bg-gray-100" readonly></div><div class="mb-4"><label class="block text-gray-700 font-semibold mb-1">Phone</label><input type="tel" name="phone" value="{{ user[2] }}" class="w-full px-3 py-2 border rounded-lg"></div><div class="mb-6"><label class="block text-gray-700 font-semibold mb-1">Member Since</label><input type="text" value="{{ user[3][:10] if user[3] else 'N/A' }}" class="w-full px-3 py-2 border rounded-lg bg-gray-100" readonly></div><div class="flex flex-col sm:flex-row gap-3"><button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded">Update Profile</button><a href="/change_password" class="bg-gray-600 text-white px-4 py-2 rounded text-center">Change Password</a></div></form></div></div></div>
</body>
</html>
