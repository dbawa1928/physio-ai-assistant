<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Change Password - PhysioAI</title>
    <script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md"><h1 class="text-2xl font-bold text-center text-purple-600 mb-5">Change Password</h1>{% if error %}<div class="bg-red-100 text-red-700 p-2 rounded mb-3 text-sm">{{ error }}</div>{% endif %}<form method="POST"><input type="password" name="current_password" placeholder="Current Password" class="w-full px-3 py-2 border rounded-lg mb-3" required><input type="password" name="new_password" placeholder="New Password" class="w-full px-3 py-2 border rounded-lg mb-3" required><input type="password" name="confirm_password" placeholder="Confirm New Password" class="w-full px-3 py-2 border rounded-lg mb-4" required><button type="submit" class="w-full bg-purple-600 text-white py-2 rounded-lg">Update Password</button></form><p class="text-center mt-4"><a href="/profile" class="text-purple-600 hover:underline">← Back to Profile</a></p></div>
</body>
</html>
